<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Avaliação | V-Side</title>

    <link rel="icon" href="assets/logos/monograma-fundo-escuro.svg">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/nova-avaliacao.css">

</head>

<body>

    <!-- =========================================
        HEADER GLOBAL - V-SIDE
    ========================================== -->

    <header class="header-global">

        <!-- LOGO -->
        <a class="link-logo-header" href="index.html" aria-label="V-Side - início">

            <img class="logo-header" src="assets/logos/logo-fundo-escuro-v2.svg" alt="V-Side">

        </a>


        <!-- NAVEGAÇÃO -->
        <nav class="navegacao-header" aria-label="Navegação principal">

            <!-- MENU INÍCIO -->
            <div class="item-menu menu-inicio">

                <a href="index.html" class="botao-menu">

                    Início

                    <img class="seta-menu" src="assets/icons/seta-para-baixo.png" alt="">

                </a>

                <div class="menu-suspenso">

                    <a href="sobre.html">Sobre</a>

                    <a class="somente-logado" href="favoritos.html">
                        Favoritos
                    </a>

                </div>

            </div>


            <!-- MENU MÚSICAS -->
            <div class="item-menu menu-musicas">

                <button class="botao-menu" type="button" aria-expanded="false">

                    Músicas

                    <img class="seta-menu" src="assets/icons/seta-para-baixo.png" alt="">

                </button>

                <div class="menu-suspenso">

                    <a href="playlists.html">
                        Playlists Recomendadas
                    </a>

                    <a class="somente-logado" href="avaliacoes.html">
                        Minhas Avaliações
                    </a>

                    <a class="somente-logado" href="cadastro-musica.html">
                        Cadastrar Música
                    </a>

                </div>

            </div>


            <!-- JOGO -->
            <a href="jogar.html">Jogar</a>

        </nav>


        <!-- BARRA DE PESQUISA -->
        <form class="barra-de-pesquisa" role="search" action="playlists.html">

            <img src="assets/icons/search.png" alt="">

            <input type="search" name="busca" placeholder="Buscar álbuns, artistas..."
                aria-label="Buscar álbuns e artistas">

        </form>


        <!-- BOTÕES PARA VISITANTES -->
        <div class="acoes-header estado-visitante">

            <a href="login.html" class="botao-entrar">
                Entrar
            </a>

            <a href="cadastro.html" class="botao-cadastrar">
                Cadastre-se
            </a>

        </div>


        <!-- BOTÕES PARA USUÁRIOS LOGADOS -->
        <div class="acoes-header estado-logado">

            <a href="nova-avaliacao.html" class="botao-entrar">
                Nova Avaliação
            </a>

            <a href="dashboard.html" class="botao-cadastrar">
                Dashboard
            </a>

        </div>

    </header>

    <main class="pagina-nova-avaliacao">

        <!-- BANNER -->

        <section class="banner-nova-avaliacao">

            <img src="assets/banners/banner-avaliacoes.png" alt="" class="imagem-banner-avaliacao">

            <div class="fundo-titulo-avaliacao"></div>

            <h1>Nova Avaliação</h1>

        </section>


        <!-- FORMULÁRIO -->

        <section class="area-formulario-avaliacao">

            <form id="formNovaAvaliacao">

                <!-- NOME DA MÚSICA -->

                <div class="campo-avaliacao">

                    <label for="nomeMusica">
                        Nome da música
                    </label>

                    <input type="text" id="nomeMusica" name="nomeMusica" required>

                </div>


                <!-- ARTISTA -->

                <div class="campo-avaliacao">

                    <label for="nomeArtista">
                        Artista
                    </label>

                    <input type="text" id="nomeArtista" name="nomeArtista" required>

                </div>


                <!-- ÁLBUM -->

                <div class="campo-avaliacao">

                    <label for="nomeAlbum">
                        Álbum
                    </label>

                    <input type="text" id="nomeAlbum" name="nomeAlbum">

                </div>


                <!-- RESENHA E NOTA -->

                <div class="cabecalho-resenha">

                    <label for="textoResenha">
                        Escreva sua resenha:
                    </label>

                    <div class="selecao-nota">

                        <span>Nota:</span>

                        <div class="estrelas-nota">

                            <input type="radio" id="estrela5" name="nota" value="5" required>
                            <label for="estrela5" title="5 estrelas">★</label>

                            <input type="radio" id="estrela4" name="nota" value="4">
                            <label for="estrela4" title="4 estrelas">★</label>

                            <input type="radio" id="estrela3" name="nota" value="3">
                            <label for="estrela3" title="3 estrelas">★</label>

                            <input type="radio" id="estrela2" name="nota" value="2">
                            <label for="estrela2" title="2 estrelas">★</label>

                            <input type="radio" id="estrela1" name="nota" value="1">
                            <label for="estrela1" title="1 estrela">★</label>

                        </div>

                    </div>

                </div>


                <textarea id="textoResenha" name="resenha" required maxlength="1500"
                    placeholder="Compartilhe sua opinião sobre a música...">
                </textarea>


                <!-- BOTÃO -->

                <div class="botao-enviar-avaliacao">

                    <button type="submit">
                        ENVIAR AVALIAÇÃO
                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- COLE AQUI O FOOTER GLOBAL -->

    <script src="js/nova-avaliacao.js"></script>
    <script src="js/global.js"></script>

</body>

</html>
