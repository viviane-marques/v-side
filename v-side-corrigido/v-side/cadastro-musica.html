<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Música | V-Side</title>

    <link rel="icon" href="assets/logos/monograma-fundo-escuro.svg">

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="css/global.css">

    <!-- CSS EXCLUSIVO -->
    <link rel="stylesheet" href="css/cadastro-musica.css">

</head>

<body>

    <!-- =========================================
        HEADER GLOBAL - V-SIDE
    ========================================== -->

    <header class="header-global">

        <!-- LOGO -->
        <a class="link-logo-header" href="index.html" aria-label="V-Side - início">

            <img class="logo-header" src="assets/logos/logo-fundo-escuro-v2.svg" alt="V-Side">

        </a>


        <!-- NAVEGAÇÃO -->
        <nav class="navegacao-header" aria-label="Navegação principal">

            <!-- MENU INÍCIO -->
            <div class="item-menu menu-inicio">

                <a href="index.html" class="botao-menu">

                    Início

                    <img class="seta-menu" src="assets/icons/seta-para-baixo.png" alt="">

                </a>

                <div class="menu-suspenso">

                    <a href="sobre.html">Sobre</a>

                    <a class="somente-logado" href="favoritos.html">
                        Favoritos
                    </a>

                </div>

            </div>


            <!-- MENU MÚSICAS -->
            <div class="item-menu menu-musicas">

                <button class="botao-menu" type="button" aria-expanded="false">

                    Músicas

                    <img class="seta-menu" src="assets/icons/seta-para-baixo.png" alt="">

                </button>

                <div class="menu-suspenso">

                    <a href="playlists.html">
                        Playlists Recomendadas
                    </a>

                    <a class="somente-logado" href="avaliacoes.html">
                        Minhas Avaliações
                    </a>

                    <a class="somente-logado" href="cadastro-musica.html">
                        Cadastrar Música
                    </a>

                </div>

            </div>


            <!-- JOGO -->
            <a href="jogar.html">Jogar</a>

        </nav>


        <!-- BARRA DE PESQUISA -->
        <form class="barra-de-pesquisa" role="search" action="playlists.html">

            <img src="assets/icons/search.png" alt="">

            <input type="search" name="busca" placeholder="Buscar álbuns, artistas..."
                aria-label="Buscar álbuns e artistas">

        </form>


        <!-- BOTÕES PARA VISITANTES -->
        <div class="acoes-header estado-visitante">

            <a href="login.html" class="botao-entrar">
                Entrar
            </a>

            <a href="cadastro.html" class="botao-cadastrar">
                Cadastre-se
            </a>

        </div>


        <!-- BOTÕES PARA USUÁRIOS LOGADOS -->
        <div class="acoes-header estado-logado">

            <a href="nova-avaliacao.html" class="botao-entrar">
                Nova Avaliação
            </a>

            <a href="dashboard.html" class="botao-cadastrar">
                Dashboard
            </a>

        </div>

    </header>


    <main class="pagina-cadastro-musica">

        <!-- =====================================
             BANNER
        ====================================== -->

        <section class="banner-cadastro-musica">

            <img src="assets/banners/banner-cadastro-musica.png" alt="" class="imagem-banner-cadastro">

            <div class="fundo-titulo-cadastro"></div>

            <h1>Cadastro no catálogo</h1>

        </section>


        <!-- =====================================
             FORMULÁRIO
        ====================================== -->

        <section class="area-formulario-cadastro">

            <form id="formCadastroCatalogo">

                <!-- SELEÇÃO DA CATEGORIA -->

                <div class="seletor-categoria">

                    <button type="button" class="opcao-categoria ativa" data-tipo="musica">

                        Música

                    </button>

                    <button type="button" class="opcao-categoria" data-tipo="album">

                        Álbum

                    </button>

                    <button type="button" class="opcao-categoria" data-tipo="artista">

                        Artista

                    </button>

                </div>


                <!-- =================================
                     CAMPOS DE MÚSICA
                ================================== -->

                <div class="grupo-campos ativo" id="campos-musica">

                    <div class="campo">

                        <label for="nomeMusica">
                            Nome da música
                        </label>

                        <input type="text" id="nomeMusica" name="nomeMusica" placeholder="Digite o nome da música">

                    </div>


                    <div class="grade-campos">

                        <div class="campo">

                            <label for="artistaMusica">
                                Artista
                            </label>

                            <input type="text" id="artistaMusica" name="artistaMusica" placeholder="Nome do artista">

                        </div>


                        <div class="campo">

                            <label for="albumMusica">
                                Álbum
                            </label>

                            <input type="text" id="albumMusica" name="albumMusica" placeholder="Nome do álbum">

                        </div>


                        <div class="campo">

                            <label for="duracaoMusica">
                                Duração
                            </label>

                            <input type="text" id="duracaoMusica" name="duracaoMusica" placeholder="Ex.: 03:45">

                        </div>


                        <div class="campo">

                            <label for="linkMusica">
                                Link do Spotify
                            </label>

                            <input type="url" id="linkMusica" name="linkMusica" placeholder="Cole o link da música">

                        </div>

                    </div>

                </div>


                <!-- =================================
                     CAMPOS DE ÁLBUM
                ================================== -->

                <div class="grupo-campos" id="campos-album" hidden>

                    <div class="campo">

                        <label for="nomeAlbum">
                            Nome do álbum
                        </label>

                        <input type="text" id="nomeAlbum" name="nomeAlbum" placeholder="Digite o nome do álbum">

                    </div>


                    <div class="grade-campos">

                        <div class="campo">

                            <label for="artistaAlbum">
                                Artista
                            </label>

                            <input type="text" id="artistaAlbum" name="artistaAlbum" placeholder="Nome do artista">

                        </div>


                        <div class="campo">

                            <label for="dataAlbum">
                                Data de lançamento
                            </label>

                            <input type="date" id="dataAlbum" name="dataAlbum">

                        </div>


                        <div class="campo">

                            <label for="generoAlbum">
                                Gênero musical
                            </label>

                            <input type="text" id="generoAlbum" name="generoAlbum" placeholder="Ex.: Pop, Rock, Indie">

                        </div>


                        <div class="campo">

                            <label for="linkAlbum">
                                Link do Spotify
                            </label>

                            <input type="url" id="linkAlbum" name="linkAlbum" placeholder="Cole o link do álbum">

                        </div>

                    </div>

                </div>


                <!-- =================================
                     CAMPOS DE ARTISTA
                ================================== -->

                <div class="grupo-campos" id="campos-artista" hidden>

                    <div class="campo">

                        <label for="nomeArtista">
                            Nome artístico
                        </label>

                        <input type="text" id="nomeArtista" name="nomeArtista" placeholder="Digite o nome do artista">

                    </div>


                    <div class="grade-campos">

                        <div class="campo">

                            <label for="generoArtista">
                                Gênero musical
                            </label>

                            <input type="text" id="generoArtista" name="generoArtista"
                                placeholder="Ex.: Rock, Pop, Rap">

                        </div>


                        <div class="campo">

                            <label for="paisArtista">
                                País de origem
                            </label>

                            <input type="text" id="paisArtista" name="paisArtista" placeholder="País do artista">

                        </div>


                        <div class="campo campo-completo">

                            <label for="linkArtista">
                                Link do Spotify
                            </label>

                            <input type="url" id="linkArtista" name="linkArtista" placeholder="Cole o link do artista">

                        </div>

                    </div>

                </div>


                <!-- BOTÃO DINÂMICO -->

                <div class="area-botao-enviar">

                    <button type="submit" id="botaoEnviarCadastro">

                        Enviar Música

                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- FOOTER GLOBAL -->
    <!-- Cole aqui o footer global já utilizado nas demais páginas -->


    <script src="js/cadastro-musica.js"></script>
    <script src="js/global.js"></script>

</body>

</html>
